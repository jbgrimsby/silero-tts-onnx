name: Export ONNX and release

# Release flow (from ANY branch): git tag vX.Y.Z && git push origin vX.Y.Z
# Steps run strictly in order; any gate failure stops the chain BEFORE
# the release step, so broken models can never be published.
on:
  push:
    tags:
      - "v*"
  # Manual runs from the Actions tab (debugging without pushing a tag).
  # Give the release a name via the `version` input (e.g. v0.4.0-rc1);
  # empty input falls back to the current ref (branch runs then create
  # a branch-named release — pass an explicit version to avoid that).
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create or update (e.g. v0.4.0-rc1)"
        required: false
        default: ""

# Least privilege: repo default stays read-only, release rights are
# granted to this workflow only (needed to create the Release and
# upload assets with GITHUB_TOKEN).
permissions:
  contents: write

jobs:
  export-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache torch.hub sources (snakers4 repo + v5_ru.pt)
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: torch-hub-snakers4-v1
          restore-keys: |
            torch-hub-snakers4-

      - name: Install build env (torch CPU + export stack) and dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-export.txt
          python -m pip install -e ".[dev]"

      - name: Export fixtures + all 5 ONNX models (L1/L2 gates)
        run: python scripts/export_all.py

      - name: Integrity check (loads, I/O names, robustness, smoke)
        run: python scripts/check_models.py

      - name: Torch-vs-ONNX end-to-end parity
        run: python scripts/check_parity.py

      - name: Test suite
        run: python -m pytest tests/ -v

      - name: Pack models into one ZIP (flat, basenames only)
        run: |
          python -c "import zipfile, os; z = zipfile.ZipFile('silero_v5_russian_onnx.zip', 'w', zipfile.ZIP_DEFLATED); [z.write(os.path.join('onnx', f), f) for f in ['acoustic_v5_ru.onnx', 'vocoder_v5_ru.onnx', 'istft_48k.onnx', 'silero_stress.onnx', 'ngram_core.onnx']]"
          ls -lh silero_v5_russian_onnx.zip onnx/*.onnx

      - name: Create GitHub Release with ZIP + individual models
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Manual runs: release under the chosen `version` input
          # (the tag is created if missing); tag pushes use their own tag.
          tag_name: ${{ inputs.version || github.ref_name }}
          # Suffixed tags (v1.0.0-rc, v1.0.0-beta, ...) become
          # pre-releases automatically; plain vX.Y.Z stays latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            silero_v5_russian_onnx.zip
            onnx/acoustic_v5_ru.onnx
            onnx/vocoder_v5_ru.onnx
            onnx/istft_48k.onnx
            onnx/silero_stress.onnx
            onnx/ngram_core.onnx
